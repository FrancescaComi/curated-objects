<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>oggetti curati</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #1a1916;
      --ink-muted: #7a7872;
      --ink-faint: #c4c2bc;
      --paper: #faf9f6;
      --paper-warm: #f2f0eb;
      --border: rgba(26,25,22,0.1);
      --serif: 'Cormorant Garamond', Georgia, serif;
      --sans: 'DM Sans', system-ui, sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
    }

    /* ── HEADER ── */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--paper);
      border-bottom: 0.5px solid var(--border);
      padding: 0 3rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
    }

    .logo {
      font-family: var(--serif);
      font-size: 22px;
      font-weight: 300;
      letter-spacing: 0.03em;
      color: var(--ink);
      text-decoration: none;
    }
    .logo em { font-style: italic; }

    .header-right {
      display: flex;
      align-items: center;
      gap: 2rem;
    }

    #item-count {
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }

    /* ── HERO ── */
    .hero {
      padding: 5rem 3rem 3.5rem;
      max-width: 520px;
    }
    .hero h1 {
      font-family: var(--serif);
      font-size: clamp(38px, 6vw, 58px);
      font-weight: 300;
      line-height: 1.08;
      letter-spacing: -0.01em;
      color: var(--ink);
      margin-bottom: 1rem;
    }
    .hero h1 em { font-style: italic; }
    .hero p {
      font-size: 13px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-muted);
      line-height: 1.7;
    }

    /* ── FILTERS ── */
    .filter-bar {
      padding: 0 3rem 2.5rem;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .filter-btn {
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 7px 16px;
      border: 0.5px solid var(--border);
      border-radius: 40px;
      background: transparent;
      color: var(--ink-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .filter-btn:hover {
      border-color: var(--ink-faint);
      color: var(--ink);
    }
    .filter-btn.active {
      background: var(--ink);
      color: var(--paper);
      border-color: var(--ink);
    }

    /* ── GRID ── */
    .grid-wrap {
      padding: 0 3rem 6rem;
    }

    .masonry {
      columns: 3;
      column-gap: 24px;
    }

    @media (max-width: 900px) { .masonry { columns: 2; } header, .hero, .filter-bar, .grid-wrap { padding-left: 1.5rem; padding-right: 1.5rem; } }
    @media (max-width: 520px) { .masonry { columns: 1; } }

    .card {
      break-inside: avoid;
      margin-bottom: 24px;
      cursor: pointer;
      opacity: 0;
      transform: translateY(16px);
      animation: fadeUp 0.5s ease forwards;
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    .card-img {
      overflow: hidden;
      background: var(--paper-warm);
      display: block;
      width: 100%;
    }
    .card-img img {
      width: 100%;
      display: block;
      transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      filter: grayscale(5%);
    }
    .card:hover .card-img img { transform: scale(1.04); }

    .card-body {
      padding: 12px 0 6px;
    }
    .card-title {
      font-family: var(--serif);
      font-size: 17px;
      font-weight: 400;
      line-height: 1.3;
      color: var(--ink);
      margin-bottom: 5px;
    }
    .card-source {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
    }
    .card-tag {
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 4px 10px;
      border: 0.5px solid var(--border);
      border-radius: 20px;
      color: var(--ink-muted);
    }
    .card-link {
      font-size: 11px;
      letter-spacing: 0.06em;
      color: var(--ink-muted);
      text-decoration: none;
      transition: color 0.15s;
    }
    .card-link:hover { color: var(--ink); }

    /* ── DIVIDER ── */
    .divider {
      width: 32px;
      height: 0.5px;
      background: var(--ink-faint);
      margin: 0 3rem 2.5rem;
    }

    /* ── STATES ── */
    .state {
      padding: 5rem 3rem;
      text-align: center;
    }
    .state-title {
      font-family: var(--serif);
      font-size: 28px;
      font-weight: 300;
      font-style: italic;
      color: var(--ink-muted);
      margin-bottom: 1rem;
    }
    .state-sub {
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-faint);
    }

    /* ── FOOTER ── */
    footer {
      border-top: 0.5px solid var(--border);
      padding: 2rem 3rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    footer span {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-faint);
    }
    footer a {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-muted);
      text-decoration: none;
      border-bottom: 0.5px solid var(--ink-faint);
      transition: color 0.15s, border-color 0.15s;
    }
    footer a:hover { color: var(--ink); border-color: var(--ink); }

    /* ── NAV TABS ── */
    .nav-tabs {
      display: flex;
      gap: 0;
      margin-left: 2rem;
    }
    .nav-tab {
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-muted);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0 1.2rem;
      height: 64px;
      border-bottom: 1.5px solid transparent;
      transition: all 0.18s;
    }
    .nav-tab:hover { color: var(--ink); }
    .nav-tab.active { color: var(--ink); border-bottom-color: var(--ink); }

    /* ── PAGE SECTIONS ── */
    .page { display: none; }
    .page.active { display: block; }

    /* ── MOODBOARD ── */
    .mb-wrap {
      padding: 3rem;
      display: flex;
      gap: 2rem;
      align-items: flex-start;
    }
    @media(max-width:900px){ .mb-wrap { flex-direction: column; padding: 1.5rem; } }

    .mb-sidebar {
      width: 220px;
      flex-shrink: 0;
    }
    .mb-sidebar-title {
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-bottom: 1rem;
    }
    .mb-room-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 1.5rem;
    }
    .mb-room-btn {
      font-family: var(--sans);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 10px 6px;
      border: 0.5px solid var(--border);
      background: transparent;
      color: var(--ink-muted);
      cursor: pointer;
      transition: all 0.18s;
      text-align: center;
    }
    .mb-room-btn:hover { border-color: var(--ink-faint); color: var(--ink); }
    .mb-room-btn.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

    .mb-pieces-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 480px;
      overflow-y: auto;
    }
    .mb-piece-thumb {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      border: 0.5px solid var(--border);
      cursor: grab;
      transition: border-color 0.15s;
      background: var(--paper);
    }
    .mb-piece-thumb:hover { border-color: var(--ink-faint); }
    .mb-piece-thumb img {
      width: 44px;
      height: 44px;
      object-fit: cover;
      flex-shrink: 0;
    }
    .mb-piece-thumb span {
      font-family: var(--serif);
      font-size: 13px;
      line-height: 1.3;
      color: var(--ink);
    }

    .mb-canvas-wrap {
      flex: 1;
      min-width: 0;
    }
    .mb-canvas-actions {
      display: flex;
      gap: 8px;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }
    .mb-btn {
      font-family: var(--sans);
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 8px 16px;
      border: 0.5px solid var(--border);
      background: transparent;
      color: var(--ink-muted);
      cursor: pointer;
      transition: all 0.18s;
    }
    .mb-btn:hover { border-color: var(--ink-faint); color: var(--ink); }
    .mb-btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }

    #mb-canvas {
      width: 100%;
      aspect-ratio: 4/3;
      position: relative;
      overflow: hidden;
      border: 0.5px solid var(--border);
      background: var(--paper-warm);
    }
    .mb-canvas-hint {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--serif);
      font-size: 18px;
      font-style: italic;
      font-weight: 300;
      color: var(--ink-faint);
      pointer-events: none;
    }
    .mb-item {
      position: absolute;
      cursor: move;
      user-select: none;
      border: 1.5px solid transparent;
    }
    .mb-item:hover, .mb-item.selected { border-color: var(--ink-faint); }
    .mb-item img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .mb-item-del {
      position: absolute;
      top: -10px;
      right: -10px;
      width: 20px;
      height: 20px;
      background: var(--ink);
      color: var(--paper);
      border: none;
      border-radius: 50%;
      font-size: 11px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    .mb-item.selected .mb-item-del { display: flex; }
    .mb-resize-handle {
      position: absolute;
      bottom: -4px;
      right: -4px;
      width: 12px;
      height: 12px;
      background: var(--ink);
      cursor: se-resize;
      display: none;
    }
    .mb-item.selected .mb-resize-handle { display: block; }

    /* ── LIGHTBOX ── */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(26,25,22,0.85);
      align-items: center;
      justify-content: center;
      padding: 2rem;
      cursor: pointer;
    }
    .lightbox.open { display: flex; }
    .lightbox-inner {
      background: var(--paper);
      max-width: 680px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      cursor: default;
    }
    .lightbox-inner img {
      width: 100%;
      display: block;
    }
    .lightbox-info {
      padding: 1.5rem 2rem 2rem;
    }
    .lightbox-title {
      font-family: var(--serif);
      font-size: 26px;
      font-weight: 300;
      line-height: 1.2;
      margin-bottom: 8px;
    }
    .lightbox-source {
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-bottom: 1.2rem;
    }
    .lightbox-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .lb-btn {
      font-family: var(--sans);
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 9px 20px;
      border: 0.5px solid var(--border);
      background: transparent;
      color: var(--ink-muted);
      text-decoration: none;
      cursor: pointer;
      transition: all 0.18s;
    }
    .lb-btn:hover, .lb-btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .lb-close {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      background: none;
      border: none;
      color: var(--paper);
      font-size: 24px;
      cursor: pointer;
      line-height: 1;
      padding: 4px 8px;
      font-weight: 300;
    }

  </style>
</head>
<body>

  <header>
    <a href="#" class="logo" onclick="switchPage('gallery');return false;">oggetti <em>curati</em></a>
    <div class="header-right">
      <div class="nav-tabs">
        <button class="nav-tab active" onclick="switchPage('gallery')">Collection</button>
        <button class="nav-tab" onclick="switchPage('moodboard')">Moodboard</button>
      </div>
      <span id="item-count"></span>
    </div>
  </header>

  <div id="page-gallery" class="page active">
  <section class="hero">
    <h1>A <em>collection</em><br>of beautiful<br>things</h1>
    <p>Furniture &amp; objects — curated over time</p>
  </section>

  <div class="divider"></div>

  <div class="filter-bar" id="filter-bar">
    <button class="filter-btn active" data-tag="all">All</button>
  </div>

  <div class="grid-wrap">
    <div class="masonry" id="grid">
      <div class="state">
        <p class="state-title">Loading your collection…</p>
      </div>
    </div>
  </div>

  </div><!-- end page-gallery -->

  <!-- MOODBOARD PAGE -->
  <div id="page-moodboard" class="page">
    <div class="mb-wrap">
      <div class="mb-sidebar">
        <p class="mb-sidebar-title">Room</p>
        <div class="mb-room-grid" id="mb-rooms"></div>
        <p class="mb-sidebar-title">Your pieces</p>
        <div class="mb-pieces-list" id="mb-pieces-list"></div>
      </div>
      <div class="mb-canvas-wrap">
        <div class="mb-canvas-actions">
          <button class="mb-btn" onclick="clearCanvas()">Clear all</button>
          <button class="mb-btn primary" onclick="saveScreenshot()">Save as image ↓</button>
        </div>
        <div id="mb-canvas">
          <div class="mb-canvas-hint" id="mb-hint">Drag pieces from the left onto your room</div>
        </div>
      </div>
    </div>
  </div><!-- end page-moodboard -->

  <footer>
    <span>oggetti curati</span>
    <a href="https://gist.github.com/FrancescaComi/f89d70fd6303df8369daf06f6942a8cc" target="_blank">edit collection ↗</a>
  </footer>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <button class="lb-close" id="lb-close">✕</button>
    <div class="lightbox-inner" id="lb-inner">
      <img id="lb-img" src="" alt=""/>
      <div class="lightbox-info">
        <div class="lightbox-title" id="lb-title"></div>
        <div class="lightbox-source" id="lb-source"></div>
        <div class="lightbox-actions">
          <a id="lb-link" href="#" target="_blank" class="lb-btn primary">Visit source ↗</a>
          <button class="lb-btn" onclick="document.getElementById('lightbox').classList.remove('open')">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script>
    const GIST_URL = 'https://gist.githubusercontent.com/FrancescaComi/f89d70fd6303df8369daf06f6942a8cc/raw/furniture.json';
    const CACHE_BUST = '?t=' + Math.floor(Date.now() / 60000);

    let allItems = [];
    let activeTag = 'all';

    async function loadData() {
      try {
        const res = await fetch(GIST_URL + CACHE_BUST);
        if (!res.ok) throw new Error('fetch failed');
        allItems = await res.json();
        init();
      } catch(e) {
        document.getElementById('grid').innerHTML = `
          <div class="state">
            <p class="state-title">Could not load collection</p>
            <p class="state-sub">Check your Gist URL or network connection</p>
          </div>`;
      }
    }

    function init() {
      buildFilters();
      renderGrid();
    }

    function buildFilters() {
      const tags = [...new Set(allItems.map(i => i.tag).filter(Boolean))].sort();
      const bar = document.getElementById('filter-bar');
      bar.innerHTML = `<button class="filter-btn active" data-tag="all" onclick="setTag('all')">All</button>`;
      tags.forEach(t => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.dataset.tag = t;
        btn.textContent = t;
        btn.onclick = () => setTag(t);
        bar.appendChild(btn);
      });
    }

    function setTag(tag) {
      activeTag = tag;
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.tag === tag);
      });
      renderGrid();
    }

    function renderGrid() {
      const filtered = activeTag === 'all' ? allItems : allItems.filter(i => i.tag === activeTag);
      const count = filtered.length;
      document.getElementById('item-count').textContent = count + ' piece' + (count !== 1 ? 's' : '');

      const grid = document.getElementById('grid');

      if (count === 0) {
        grid.innerHTML = `
          <div class="state">
            <p class="state-title">Nothing here yet</p>
            <p class="state-sub">Save your first piece using the bookmarklet</p>
          </div>`;
        return;
      }

      grid.innerHTML = filtered.map((item, i) => `
        <div class="card" style="animation-delay:${i * 40}ms" onclick="openLightbox(${i})">
          <div class="card-img">
            <img src="${escHtml(item.url)}" alt="${escHtml(item.title)}" loading="lazy"/>
          </div>
          <div class="card-body">
            <div class="card-title">${escHtml(item.title)}</div>
            <div class="card-source">${escHtml(item.source || '')}</div>
            <div class="card-footer">
              ${item.tag ? `<span class="card-tag">${escHtml(item.tag)}</span>` : '<span></span>'}
              ${item.link ? `<a class="card-link" href="${escHtml(item.link)}" target="_blank" onclick="event.stopPropagation()">Source ↗</a>` : ''}
            </div>
          </div>
        </div>
      `).join('');
    }

    function openLightbox(index) {
      const filtered = activeTag === 'all' ? allItems : allItems.filter(i => i.tag === activeTag);
      const item = filtered[index];
      if (!item) return;
      document.getElementById('lb-img').src = item.url;
      document.getElementById('lb-title').textContent = item.title;
      document.getElementById('lb-source').textContent = item.source || '';
      const link = document.getElementById('lb-link');
      if (item.link) { link.href = item.link; link.style.display = ''; }
      else { link.style.display = 'none'; }
      document.getElementById('lightbox').classList.add('open');
    }

    document.getElementById('lightbox').addEventListener('click', function(e) {
      if (e.target === this) this.classList.remove('open');
    });
    document.getElementById('lb-close').addEventListener('click', () => {
      document.getElementById('lightbox').classList.remove('open');
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') document.getElementById('lightbox').classList.remove('open');
    });

    function escHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ── PAGE SWITCHING ──
    function switchPage(page) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
      document.getElementById('page-' + page).classList.add('active');
      document.querySelectorAll('.nav-tab')[page === 'gallery' ? 0 : 1].classList.add('active');
      if (page === 'moodboard') buildMoodboard();
    }
    window.switchPage = switchPage;

    // ── MOODBOARD ──
    const ROOMS = [
      { id: 'living', label: 'Living room', bg: '#f0ece4' },
      { id: 'bedroom', label: 'Bedroom', bg: '#e8e4dc' },
      { id: 'kitchen', label: 'Kitchen', bg: '#e4e8e0' },
      { id: 'office', label: 'Office', bg: '#e4e0e8' },
      { id: 'dining', label: 'Dining', bg: '#ece8e0' },
      { id: 'bathroom', label: 'Bathroom', bg: '#e0e8e8' },
    ];

    let activeRoom = 'living';
    let selectedItem = null;

    function buildMoodboard() {
      // rooms
      const roomGrid = document.getElementById('mb-rooms');
      roomGrid.innerHTML = ROOMS.map(r => `
        <button class="mb-room-btn${r.id === activeRoom ? ' active' : ''}" onclick="setRoom('${r.id}')">${r.label}</button>
      `).join('');
      setRoom(activeRoom, false);

      // pieces list
      const list = document.getElementById('mb-pieces-list');
      list.innerHTML = allItems.map((item, i) => `
        <div class="mb-piece-thumb" draggable="true" data-index="${i}"
          ondragstart="onDragStart(event,${i})">
          <img src="${escHtml(item.url)}" alt="${escHtml(item.title)}" onerror="this.style.display='none'"/>
          <span>${escHtml(item.title)}</span>
        </div>
      `).join('');
    }

    function setRoom(id, rebuild = true) {
      activeRoom = id;
      const room = ROOMS.find(r => r.id === id);
      document.getElementById('mb-canvas').style.background = room ? room.bg : '#f0ece4';
      if (rebuild) {
        document.querySelectorAll('.mb-room-btn').forEach((b, i) => {
          b.classList.toggle('active', ROOMS[i].id === id);
        });
      }
    }
    window.setRoom = setRoom;

    // drag from sidebar
    let dragIndex = null;
    function onDragStart(e, index) {
      dragIndex = index;
      e.dataTransfer.effectAllowed = 'copy';
    }
    window.onDragStart = onDragStart;

    const canvas = document.getElementById('mb-canvas');
    canvas.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
    canvas.addEventListener('drop', e => {
      e.preventDefault();
      if (dragIndex === null) return;
      const item = allItems[dragIndex];
      if (!item) return;
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      addItemToCanvas(item, x, y);
      dragIndex = null;
      document.getElementById('mb-hint').style.display = 'none';
    });

    function addItemToCanvas(item, cx, cy) {
      const el = document.createElement('div');
      el.className = 'mb-item';
      const size = 160;
      el.style.cssText = `width:${size}px;height:${size}px;left:${cx - size/2}px;top:${cy - size/2}px;`;

      el.innerHTML = `
        <img src="${escHtml(item.url)}" alt="${escHtml(item.title)}" draggable="false"/>
        <button class="mb-item-del" onclick="this.parentNode.remove();deselectAll()">✕</button>
        <div class="mb-resize-handle"></div>
      `;

      // select on click
      el.addEventListener('mousedown', e => {
        if (e.target.classList.contains('mb-item-del') || e.target.classList.contains('mb-resize-handle')) return;
        deselectAll();
        el.classList.add('selected');
        selectedItem = el;
        startDragItem(e, el);
      });

      // resize
      const handle = el.querySelector('.mb-resize-handle');
      handle.addEventListener('mousedown', e => {
        e.stopPropagation();
        const startX = e.clientX, startY = e.clientY;
        const startW = el.offsetWidth, startH = el.offsetHeight;
        function onMove(e) {
          const w = Math.max(60, startW + e.clientX - startX);
          const h = Math.max(60, startH + e.clientY - startY);
          el.style.width = w + 'px';
          el.style.height = h + 'px';
        }
        function onUp() { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); }
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });

      canvas.appendChild(el);
    }

    function startDragItem(e, el) {
      const rect = canvas.getBoundingClientRect();
      const startX = e.clientX - el.offsetLeft;
      const startY = e.clientY - el.offsetTop;
      function onMove(e) {
        const x = Math.max(0, Math.min(canvas.offsetWidth - el.offsetWidth, e.clientX - startX));
        const y = Math.max(0, Math.min(canvas.offsetHeight - el.offsetHeight, e.clientY - startY));
        el.style.left = x + 'px';
        el.style.top = y + 'px';
      }
      function onUp() { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    }

    document.addEventListener('mousedown', e => {
      if (!e.target.closest('.mb-item')) deselectAll();
    });

    function deselectAll() {
      document.querySelectorAll('.mb-item').forEach(el => el.classList.remove('selected'));
      selectedItem = null;
    }

    function clearCanvas() {
      document.querySelectorAll('#mb-canvas .mb-item').forEach(el => el.remove());
      document.getElementById('mb-hint').style.display = '';
    }
    window.clearCanvas = clearCanvas;

    async function saveScreenshot() {
      // Use html2canvas if available, otherwise prompt
      if (typeof html2canvas !== 'undefined') {
        const cvs = await html2canvas(canvas, { useCORS: true, scale: 2 });
        const a = document.createElement('a');
        a.download = 'moodboard.png';
        a.href = cvs.toDataURL();
        a.click();
      } else {
        alert('To save: right-click on the moodboard and choose "Save image as", or take a screenshot.');
      }
    }
    window.saveScreenshot = saveScreenshot;

    loadData();
  </script>

</body>
</html>
