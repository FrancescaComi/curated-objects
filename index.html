<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>my mother calls me popi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ink: #1a1916; --ink-muted: #7a7872; --ink-faint: #c4c2bc;
      --paper: #faf9f6; --paper-warm: #f2f0eb; --border: rgba(26,25,22,0.1);
      --serif: 'Cormorant Garamond', Georgia, serif; --sans: 'DM Sans', system-ui, sans-serif;
    }
    html { scroll-behavior: smooth; }
    body { background: var(--paper); color: var(--ink); font-family: var(--sans); font-weight: 300; -webkit-font-smoothing: antialiased; }
    header { position: sticky; top: 0; z-index: 100; background: var(--paper); border-bottom: 0.5px solid var(--border); padding: 0 3rem; display: flex; align-items: center; justify-content: space-between; height: 64px; }
    .logo { font-family: var(--serif); font-size: 22px; font-weight: 300; letter-spacing: 0.03em; color: var(--ink); text-decoration: none; }
    .logo em { font-style: italic; }
    #item-count { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-muted); }
    .hero { padding: 5rem 3rem 3.5rem; max-width: 520px; }
    .hero h1 { font-family: var(--serif); font-size: clamp(38px, 6vw, 58px); font-weight: 300; line-height: 1.08; letter-spacing: -0.01em; color: var(--ink); margin-bottom: 1rem; }
    .hero h1 em { font-style: italic; }
    .hero p { font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-muted); line-height: 1.7; }
    .filter-bar { padding: 0 3rem 2.5rem; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .filter-btn { font-family: var(--sans); font-size: 11px; font-weight: 400; letter-spacing: 0.1em; text-transform: uppercase; padding: 7px 16px; border: 0.5px solid var(--border); border-radius: 40px; background: transparent; color: var(--ink-muted); cursor: pointer; transition: all 0.2s ease; }
    .filter-btn:hover { border-color: var(--ink-faint); color: var(--ink); }
    .filter-btn.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .grid-wrap { padding: 0 3rem 6rem; }
    .masonry { columns: 3; column-gap: 24px; }
    @media (max-width: 900px) { .masonry { columns: 2; } header, .hero, .filter-bar, .grid-wrap { padding-left: 1.5rem; padding-right: 1.5rem; } }
    @media (max-width: 520px) { .masonry { columns: 1; } }
    .card { break-inside: avoid; margin-bottom: 24px; cursor: pointer; opacity: 0; transform: translateY(16px); animation: fadeUp 0.5s ease forwards; }
    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
    .card-img { overflow: hidden; background: var(--paper-warm); display: block; width: 100%; }
    .card-img img { width: 100%; display: block; transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94); filter: grayscale(5%); }
    .card:hover .card-img img { transform: scale(1.04); }
    .card-body { padding: 12px 0 6px; }
    .card-title { font-family: var(--serif); font-size: 17px; font-weight: 400; line-height: 1.3; color: var(--ink); margin-bottom: 5px; }
    .card-source { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-muted); }
    .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
    .card-tag { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; padding: 4px 10px; border: 0.5px solid var(--border); border-radius: 20px; color: var(--ink-muted); }
    .card-link { font-size: 11px; letter-spacing: 0.06em; color: var(--ink-muted); text-decoration: none; transition: color 0.15s; }
    .card-link:hover { color: var(--ink); }
    .divider { width: 32px; height: 0.5px; background: var(--ink-faint); margin: 0 3rem 2.5rem; }
    .state { padding: 5rem 3rem; text-align: center; }
    .state-title { font-family: var(--serif); font-size: 28px; font-weight: 300; font-style: italic; color: var(--ink-muted); margin-bottom: 1rem; }
    .state-sub { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-faint); }
    footer { border-top: 0.5px solid var(--border); padding: 2rem 3rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
    footer span { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-faint); }
    footer a { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-muted); text-decoration: none; border-bottom: 0.5px solid var(--ink-faint); transition: color 0.15s, border-color 0.15s; }
    footer a:hover { color: var(--ink); border-color: var(--ink); }
    .lightbox { display: none; position: fixed; inset: 0; z-index: 1000; background: rgba(26,25,22,0.85); align-items: center; justify-content: center; padding: 2rem; cursor: pointer; }
    .lightbox.open { display: flex; }
    .lightbox-inner { background: var(--paper); max-width: 680px; width: 100%; max-height: 90vh; overflow-y: auto; display: flex; flex-direction: column; cursor: default; }
    .lightbox-inner img { width: 100%; display: block; }
    .lightbox-info { padding: 1.5rem 2rem 2rem; }
    .lightbox-title { font-family: var(--serif); font-size: 26px; font-weight: 300; line-height: 1.2; margin-bottom: 8px; }
    .lightbox-source { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 1.2rem; }
    .lightbox-actions { display: flex; gap: 12px; flex-wrap: wrap; }
    .lb-btn { font-family: var(--sans); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; padding: 9px 20px; border: 0.5px solid var(--border); background: transparent; color: var(--ink-muted); text-decoration: none; cursor: pointer; transition: all 0.18s; }
    .lb-btn:hover, .lb-btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .lb-close { position: absolute; top: 1.5rem; right: 1.5rem; background: none; border: none; color: var(--paper); font-size: 24px; cursor: pointer; line-height: 1; padding: 4px 8px; font-weight: 300; }
    .site-comments { padding: 3.5rem 3rem 4rem; max-width: 520px; border-top: 0.5px solid var(--border); }
    .site-comments-label { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 1rem; }
    .site-comments-contact { font-size: 13px; color: var(--ink-muted); margin-bottom: 1.75rem; line-height: 1.6; }
    .site-comments-contact a { color: var(--ink); text-decoration: none; border-bottom: 0.5px solid var(--ink-faint); transition: color 0.15s, border-color 0.15s; }
    .site-comments-contact a:hover { border-color: var(--ink); }
    @media (max-width: 900px) { .site-comments { padding-left: 1.5rem; padding-right: 1.5rem; } }
  </style>
  
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-MMWGNYXKH2"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-MMWGNYXKH2');
</script>
  
</head>
<body>

  <header>
    <a href="#" class="logo">my mother calls me <em>popi</em></a>
    <span id="item-count"></span>
  </header>

  <section class="hero">
    <h1>A <em>collection</em><br>of beautiful<br>things</h1>
    <p>Furniture &amp; objects — curated over time</p>
  </section>

  <div class="divider"></div>

  <div class="filter-bar" id="filter-bar">
    <button class="filter-btn active" data-tag="all">All</button>
  </div>

  <div class="grid-wrap">
    <div class="masonry" id="grid">
      <div class="state">
        <p class="state-title">Loading your collection…</p>
      </div>
    </div>
  </div>

  <div class="site-comments">
    <div class="site-comments-label">Questions &amp; comments</div>
    <p class="site-comments-contact">For anything else, find me on Instagram <a href="https://www.instagram.com/francescacomi" target="_blank">@francescacomi</a></p>
    <div id="cusdis_thread"></div>
  </div>

  <footer>
    <span>my mother calls me popi</span>
    <a href="https://gist.github.com/FrancescaComi/f89d70fd6303df8369daf06f6942a8cc" target="_blank">edit collection ↗</a>
  </footer>

  <div class="lightbox" id="lightbox">
    <button class="lb-close" id="lb-close">✕</button>
    <div class="lightbox-inner">
      <img id="lb-img" src="" alt=""/>
      <div class="lightbox-info">
        <div class="lightbox-title" id="lb-title"></div>
        <div class="lightbox-source" id="lb-source"></div>
        <div class="lightbox-actions">
          <a id="lb-link" href="#" target="_blank" class="lb-btn primary">Visit source ↗</a>
          <button class="lb-btn" onclick="document.getElementById('lightbox').classList.remove('open')">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const GIST_URL = 'https://gist.githubusercontent.com/FrancescaComi/f89d70fd6303df8369daf06f6942a8cc/raw/furniture.json';
    const CACHE_BUST = '?t=' + Math.floor(Date.now() / 60000);
    let allItems = [], activeTag = 'all';

    // ---- Cusdis comments config ----
    const CUSDIS_APP_ID = 'e5560180-5607-4d62-bdbe-becd30455d99';
    const CUSDIS_HOST = 'https://cusdis.com';

    function renderSiteComments() {
      const el = document.getElementById('cusdis_thread');
      el.setAttribute('data-host', CUSDIS_HOST);
      el.setAttribute('data-app-id', CUSDIS_APP_ID);
      el.setAttribute('data-page-id', 'site-questions');
      el.setAttribute('data-page-url', location.href.split('#')[0]);
      el.setAttribute('data-page-title', 'my mother calls me popi');
      const tryRender = () => {
        if (window.CUSDIS && window.CUSDIS.renderTo) {
          window.CUSDIS.renderTo(el);
        } else {
          setTimeout(tryRender, 150);
        }
      };
      tryRender();
    }
    renderSiteComments();
    // ---------------------------------

    async function loadData() {
      try {
        const res = await fetch(GIST_URL + CACHE_BUST);
        if (!res.ok) throw new Error();
        allItems = await res.json();
        buildFilters(); renderGrid();
      } catch(e) {
        document.getElementById('grid').innerHTML = '<div class="state"><p class="state-title">Could not load collection</p><p class="state-sub">Check your Gist URL or network connection</p></div>';
      }
    }

    function buildFilters() {
      const tags = [...new Set(allItems.map(i => i.tag).filter(Boolean))].sort();
      const bar = document.getElementById('filter-bar');
      bar.innerHTML = '<button class="filter-btn active" data-tag="all" onclick="setTag(\'all\')">All</button>';
      tags.forEach(t => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn'; btn.dataset.tag = t; btn.textContent = t;
        btn.onclick = () => setTag(t); bar.appendChild(btn);
      });
    }

    function setTag(tag) {
      activeTag = tag;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.tag === tag));
      renderGrid();
    }

    function renderGrid() {
      const filtered = activeTag === 'all' ? allItems : allItems.filter(i => i.tag === activeTag);
      document.getElementById('item-count').textContent = filtered.length + ' piece' + (filtered.length !== 1 ? 's' : '');
      const grid = document.getElementById('grid');
      if (!filtered.length) { grid.innerHTML = '<div class="state"><p class="state-title">Nothing here yet</p><p class="state-sub">Save your first piece using the bookmarklet</p></div>'; return; }
      grid.innerHTML = filtered.map((item, i) => `
        <div class="card" style="animation-delay:${i*40}ms" onclick="openLightbox(${i})">
          <div class="card-img"><img src="${esc(item.url)}" alt="${esc(item.title)}" loading="lazy"/></div>
          <div class="card-body">
            <div class="card-title">${esc(item.title)}</div>
            <div class="card-source">${esc(item.source||'')}</div>
            <div class="card-footer">
              ${item.tag?`<span class="card-tag">${esc(item.tag)}</span>`:'<span></span>'}
              ${item.link?`<a class="card-link" href="${esc(item.link)}" target="_blank" onclick="event.stopPropagation()">Source ↗</a>`:''}
            </div>
          </div>
        </div>`).join('');
    }

    function openLightbox(i) {
      const filtered = activeTag === 'all' ? allItems : allItems.filter(x => x.tag === activeTag);
      const item = filtered[i]; if (!item) return;
      document.getElementById('lb-img').src = item.url;
      document.getElementById('lb-title').textContent = item.title;
      document.getElementById('lb-source').textContent = item.source || '';
      const link = document.getElementById('lb-link');
      if (item.link) { link.href = item.link; link.style.display = ''; } else { link.style.display = 'none'; }
      document.getElementById('lightbox').classList.add('open');
    }

    document.getElementById('lightbox').addEventListener('click', function(e) { if (e.target===this) this.classList.remove('open'); });
    document.getElementById('lb-close').addEventListener('click', () => document.getElementById('lightbox').classList.remove('open'));
    document.addEventListener('keydown', e => { if (e.key==='Escape') document.getElementById('lightbox').classList.remove('open'); });

    function esc(s) { return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):''; }

    loadData();
  </script>

  <script async defer src="https://cusdis.com/js/cusdis.es.js"></script>
</body>
</html>
